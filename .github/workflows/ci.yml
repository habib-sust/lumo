name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast gate: guards + the real test suite. Both run on the macOS host in seconds
  # because LumoCore is Foundation-only. Kept separate from the build job so a
  # forbidden-pattern violation fails in ~30s instead of after a full Xcode build.
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || xcodebuild -version

      - name: Forbidden patterns
        run: ./Scripts/lint-forbidden.sh

      - name: Import allowlists
        run: ./Scripts/lint-imports.sh

      - name: Guards self-test
        run: ./Scripts/test-guards.sh

      - name: LumoCore tests
        run: swift test --package-path Packages/LumoCore --enable-code-coverage

  # Compiles every target for iOS without signing. Catches actor-isolation and
  # availability mistakes — the majority of extension bugs — with no device.
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || xcodebuild -version

      - name: Build for iOS
        run: |
          xcodebuild build -scheme Lumo \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO -quiet

      # Covers the seams where every device bug lived: SwiftUI presentation semantics,
      # navigation state, and whether saving silently wipes data. The system app picker cannot
      # run in the Simulator, so selections are seeded via launch arguments instead.
      - name: UI tests
        run: |
          xcodebuild test -scheme Lumo \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.5' \
            -only-testing:LumoUITests CODE_SIGNING_ALLOWED=NO -quiet

# NOT covered here, and cannot be: AuthorizationCenter, ManagedSettingsStore,
# DeviceActivityCenter, FamilyActivityPicker, and all three app extensions. Family
# Controls does not function in the Simulator at all — it needs a passcode-locked,
# iCloud-signed-in physical device. The shield path is gated on the signed-off matrix
# in docs/qa/device-matrix.md, keyed to a commit SHA, as a RELEASE gate.
#
# Self-hosted device runners were considered and rejected for v1: a device that must
# stay passcode-locked and iCloud-signed-in is hostile to unattended CI, and the
# maintenance burden exceeds the matrix it would replace.
